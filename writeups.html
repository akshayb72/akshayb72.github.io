<!DOCTYPE html>
<html lang="en" data-theme="light">
<!--
  writeups.html — Auto-enumerating writeups listing page
  ────────────────────────────────────────────────────────
  HOW TO ADD A NEW WRITEUP:
    1. Create your writeup HTML file in the writeups/ folder
    2. Open writeups/index.json
    3. Add one object to the array:
         {
           "title":       "Challenge Name",
           "file":        "challenge-name.html",
           "description": "One or two sentence summary.",
           "tags":        ["rev", "htb", "easy"],
           "date":        "Jun 2025"
         }
    4. Save. That's it — the card appears automatically.

  You never need to touch this HTML file when adding writeups.
  All card generation is handled by writeups.js reading index.json.

  TO ADD A NEW TAG FILTER:
    1. Add a <button class="filter-btn" data-filter="yourcat"> below
    2. Add .tag--yourcat to css/style.css
    3. Use "yourcat" in the tags array in index.json
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writeups — akshayb72</title>
  <meta name="description" content="CTF writeups and security research by akshayb72.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/writeups.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">akshayb72</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="writeups.html">Writeups</a>
        <button id="theme-toggle" aria-label="Toggle theme">◑</button>
      </div>
    </div>
  </nav>

  <main class="page-body">
    <div class="layout-wide">

      <header class="page-header">
        <h1>Writeups</h1>
        <p>CTF challenges, reverse engineering, and security research notes.</p>
      </header>

      <!-- Search bar -->
      <div class="search-wrap">
        <input
          type="search"
          id="search-input"
          placeholder="Search writeups..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search writeups"
        >
      </div>

      <!-- Filter buttons — add new ones here as needed -->
      <div class="filter-bar" role="group" aria-label="Filter by category">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="rev">Reversing</button>
        <button class="filter-btn" data-filter="web">Web</button>
        <button class="filter-btn" data-filter="pwn">Pwn</button>
        <button class="filter-btn" data-filter="misc">Misc</button>
        <button class="filter-btn" data-filter="htb">HTB</button>
      </div>

      <!-- Result count — updated live by writeups.js -->
      <span id="result-count"></span>

      <!--
        Cards are injected here by writeups.js.
        Do not put any <article> elements here manually —
        they will be overwritten when the page loads.
      -->
      <div class="cards-grid" id="cards-grid">
        <!-- Loading state — replaced by JS -->
        <p id="loading-msg" style="
          font-family: 'IBM Plex Mono', monospace;
          font-size: 12px;
          color: var(--text-dim);
          padding: 8px 0;
        ">Loading writeups...</p>
      </div>

      <!-- Empty state — shown when search returns nothing -->
      <div id="no-results">No writeups match your search.</div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>akshayb72.github.io</span>
      <span>reverse engineering · ctf writeups</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/writeups.js"></script>
</body>
</html>
